plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

configurations {
    cxfCodegen
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // JAX-WS client runtime only (no CXF servlet / Spring Boot starter needed on the consumer side)
    implementation "org.apache.cxf:cxf-rt-frontend-jaxws:${cxfVersion}"
    implementation "org.apache.cxf:cxf-rt-transports-http:${cxfVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    cxfCodegen "org.apache.cxf:cxf-tools-wsdlto-frontend-jaxws:${cxfVersion}"
    cxfCodegen "org.apache.cxf:cxf-tools-wsdlto-databinding-jaxb:${cxfVersion}"
}

// ---- WSDL -> Java code generation (CXF wsdl2java, no third-party plugin) ----
// The client generates its own stubs from the contract, exactly as an external consumer would.
def contractDir = rootProject.file('contract')
def generatedDir = layout.buildDirectory.dir('generated/sources/wsdl2java')

def wsdl2java = tasks.register('wsdl2java', JavaExec) {
    group = 'build'
    description = 'Generates JAX-WS client classes from contract/movies.wsdl'
    inputs.dir(contractDir)
    outputs.dir(generatedDir)
    classpath = configurations.cxfCodegen
    mainClass = 'org.apache.cxf.tools.wsdlto.WSDLToJava'
    args '-d', generatedDir.get().asFile.path,
         '-wsdlLocation', 'classpath:wsdl/movies.wsdl',
         '-p', 'http://example.com/movies/v1=com.example.movies.v1',
         new File(contractDir, 'movies.wsdl').path
}

// Adding the task as a source dir also makes compileJava depend on it.
sourceSets.main.java.srcDir(wsdl2java)

// The generated MovieService loads the WSDL from the classpath, so it never fetches it over HTTP.
processResources {
    from(contractDir) {
        include '*.wsdl', '*.xsd'
        into 'wsdl'
    }
}

bootJar {
    archiveFileName = 'client.jar'
}

jar {
    enabled = false
}
